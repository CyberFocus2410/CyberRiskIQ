# render.yaml
# Render.com Infrastructure-as-Code Blueprint for CyberRiskIQ Free-Tier Deployment

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: cyberriskiq-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set to Supabase Transaction Pooler URL (postgresql://postgres.[ref]:[pass]@aws-0-[region].pooler.supabase.com:6543/postgres)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: cyberriskiq-frontend
    runtime: static
    plan: free
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cyberriskiq-api
          property: host
